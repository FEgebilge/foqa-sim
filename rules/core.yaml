# FOQA-Sim core rule set v2.
#
# Each document is one event definition. Thresholds name their source in the
# description; "FOQA-Sim estimate" marks values without a published source.
# Thresholds are exceeded strictly (`above` > value, `below` < value).
# `detail` says the event in words; without it a numeric rule reads
# "{value}, limit {threshold}".
# `domain` is the part of a landing assessment an event counts toward
# (docs/scoring.md 3). The approach rules follow EASA Data4Safety's
# split at 500 ft (docs/scoring.md 2.5).
# Language reference: docs/rules.md

rule: unstable-speed-above-500
version: 1
title: Approach speed off Vref above 500 ft
domain: stability
description: >
  IAS against Vref (type profile: Vref table by gross weight and flap) from
  1000 ft to 500 ft, held 3 s. EASA Data4Safety unstable-approach guidance
  (Rev 00, 2022), first and second thresholds above 500 ft (SL1, SL2A):
  above Vref+20 / Vref+35, below Vref-5 / Vref-10. Silent without a Vref.
why_it_matters: >
  Too fast lengthens the flare and the landing roll and invites a float or
  long landing; too slow erodes the margin above the stall and leaves little
  energy for a go-around.
advice: >
  Fly the approach speed (Vref plus the wind additive) and have it set by
  1000 ft; if it will not be there by the stabilisation gate, go around.
phase: Approach
aircraft: transport
when: height < 1000 ft and height >= 500 ft
measure: ias - profile.vref
detail: "{ias}, {value} from Vref {profile.vref}, limit {threshold}"
sustain: 3 s
above: { low: 20 kt, medium: 35 kt }
below: { low: -5 kt, medium: -10 kt }
---
rule: unstable-speed-below-500
version: 1
title: Approach speed off Vref below 500 ft
domain: stability
description: >
  IAS against Vref (type profile) from 500 ft to the flare, held 3 s. EASA
  Data4Safety: below 500 ft the first and second thresholds are SL2B and
  SL3 (above Vref+20 / Vref+35, below Vref-5 / Vref-10). Silent without a
  Vref.
why_it_matters: >
  Off speed close to the ground there is no height left to correct: fast
  means a float and a long landing, slow a hard landing or a tail strike.
advice: >
  Below 500 ft an approach off speed is unstable: go around rather than
  chase the speed in the flare.
phase: Approach
aircraft: transport
when: height < 500 ft
measure: ias - profile.vref
detail: "{ias}, {value} from Vref {profile.vref}, limit {threshold}"
sustain: 3 s
above: { medium: 20 kt, high: 35 kt }
below: { medium: -5 kt, high: -10 kt }
---
rule: unstable-speed-light
version: 1
title: Approach speed off the published speed below 500 ft
domain: stability
description: >
  IAS against the approach speed of the type profile (the middle of the
  POH range for the flaps set, or 1.3 VSO) from 500 ft to the flare, held
  3 s. The levels (+15/-7.5, +20/-10, +30/-15 kt) are a FOQA-Sim estimate
  beyond the Private/Commercial ACS tolerance (+10/-5 kt). Silent without a
  published speed.
why_it_matters: >
  Too fast floats down the runway; too slow leaves little margin above the
  stall in the flare.
advice: >
  Trim for the POH approach speed for the flaps set and hold it to the
  flare; off it at 500 ft, go around.
phase: Approach
aircraft: light
when: height < 500 ft
measure: ias - profile.vapp
detail: "{ias}, {value} from {profile.vapp}, limit {threshold}"
sustain: 3 s
above: { low: 15 kt, medium: 20 kt, high: 30 kt }
below: { low: -7.5 kt, medium: -10 kt, high: -15 kt }
---
rule: unstable-sink-500
version: 2
title: High descent rate at 500 ft
domain: stability
description: >
  Rate of descent at the 500 ft gate against the FSF ALAR stabilised
  approach limit, 1000 fpm. An advisory: the descent below 500 ft is graded
  by `high-sink-below-500` and `high-sink-light`.
why_it_matters: >
  A steep, fast descent at 500 ft leaves little height to arrest the sink, a
  common precursor of hard and short landings.
advice: >
  Fly a stable path of about 3 degrees (roughly 500-700 fpm in a light
  aircraft, 700-800 fpm in a jet). More than 1000 fpm at the gate: go
  around.
phase: Approach
gate: height <= 500 ft
measure: -vs
detail: "{value} sink, limit {threshold}"
above: { advisory: 1000 fpm }
---
rule: unstable-bank-500
version: 2
title: Bank at 500 ft
domain: stability
description: >
  Bank angle at the 500 ft gate against the EAFDM stabilised-approach
  limit, 7 deg. An advisory: bank is graded by `bank-above-500`,
  `bank-below-500` and `bank-light`.
why_it_matters: >
  Still turning at 500 ft means the aircraft is not lined up with the
  runway, and bank raises the stall speed close to the ground.
advice: >
  Roll out on final above 500 ft: extend the downwind or widen the base turn
  so the final is straight and wings-level. Not aligned at the gate: go
  around.
phase: Approach
gate: height <= 500 ft
measure: abs(roll)
detail: "{value} bank, limit {threshold}"
above: { advisory: 7 deg }
---
rule: localizer-deviation-500
version: 1
title: Localizer deviation at 500 ft
domain: stability
description: >
  EASA EOFDM example: more than 1/4 dot. Not evaluated without a localizer
  signal. Dot scaling of the sim needle is not yet verified on an ILS.
why_it_matters: >
  Off the localizer at 500 ft the aircraft is not aligned with the runway;
  correcting late takes large banks close to the ground.
advice: >
  Keep the localizer centred with small heading corrections; more than 1/4
  dot at the gate is an unstable approach: go around.
phase: Approach
gate: height <= 500 ft
measure: abs(nav.loc_dev)
detail: "{value} off the localizer, limit {threshold}"
above: { low: 0.25 dot, medium: 0.5 dot, high: 1 dot }
---
rule: glideslope-deviation-500
version: 1
title: Glideslope deviation at 500 ft
domain: stability
description: >
  EASA EOFDM example: more than 1 dot. Not evaluated without a glideslope
  signal. Dot scaling of the sim needle is not yet verified on an ILS.
why_it_matters: >
  Off the glideslope at 500 ft the aircraft is high (long landing, steep
  correction) or low (obstacle and short-landing risk).
advice: >
  Correct path deviations early with small pitch and power changes; more
  than 1 dot at the gate: go around.
phase: Approach
gate: height <= 500 ft
measure: abs(nav.gs_dev)
detail: "{value} off the glideslope, limit {threshold}"
above: { low: 1 dot, medium: 1.5 dot, high: 2 dot }
---
rule: localizer-deviation-above-500
version: 1
title: Localizer deviation from 1000 ft to 500 ft
domain: stability
description: >
  EASA Data4Safety: more than 1 dot (SL1) or 1.5 dot (SL2A), held 5 s,
  from 1000 ft to 500 ft. Not evaluated without a localizer signal. Dot
  scaling of the sim needle is not yet verified on an ILS.
why_it_matters: >
  Off the localizer on final the aircraft is not aligned with the runway;
  correcting late takes large banks close to the ground.
advice: >
  Keep the localizer centred with small heading corrections; more than a
  dot off by 500 ft: go around.
phase: Approach
when: height < 1000 ft and height >= 500 ft
measure: abs(nav.loc_dev)
detail: "{value} off the localizer, limit {threshold}"
sustain: 5 s
above: { low: 1 dot, medium: 1.5 dot }
---
rule: glideslope-deviation-above-500
version: 1
title: Glideslope deviation from 1000 ft to 500 ft
domain: stability
description: >
  EASA Data4Safety: more than 1 dot (SL1) or 2 dots (SL2A), held 5 s, from
  1000 ft to 500 ft. Not evaluated without a glideslope signal. Dot scaling
  of the sim needle is not yet verified on an ILS.
why_it_matters: >
  Off the glideslope on final the aircraft is high (long landing, steep
  correction) or low (obstacle and short-landing risk).
advice: >
  Correct path deviations early with small pitch and power changes; more
  than a dot off by 500 ft: go around.
phase: Approach
when: height < 1000 ft and height >= 500 ft
measure: abs(nav.gs_dev)
detail: "{value} off the glideslope, limit {threshold}"
sustain: 5 s
above: { low: 1 dot, medium: 2 dot }
---
rule: gear-not-down-500
version: 2
title: Landing gear not down at 500 ft
domain: stability
description: >
  CAP 739 lists gear not established at the stabilisation gate. Every
  class: gear-up landings are mostly a light retractable's accident, and
  fixed gear always reads 100 % (the sim reports it extended), so the rule
  stays silent for it.
why_it_matters: >
  Landing with the gear not down and locked means a gear-up landing:
  aircraft damage and risk to the occupants.
advice: >
  Complete the landing checklist and confirm three greens before 1000 ft.
  Gear not down at 500 ft: go around.
phase: Approach
gate: height <= 500 ft
measure: gear.extended < 99 %
level: high
---
rule: high-sink-above-500
version: 1
title: High descent rate above 500 ft
domain: stability
description: >
  Descent rate from 1000 ft to 500 ft. EASA Data4Safety, above 500 ft:
  more than 1200 fpm (SL1) or 1500 fpm (SL2A). Held 5 s, Data4Safety's
  persistence for the first threshold (3 s for the second; a rule has one).
why_it_matters: >
  A sustained high descent rate close to the ground leaves little room to
  arrest it and is a classic precursor of hard landings and controlled
  flight into terrain.
advice: >
  Stay on a stable path; if it needs more than 1000 fpm below 1000 ft, the
  approach is too high: go around and set up again.
phase: Approach
aircraft: transport
when: height < 1000 ft and height >= 500 ft
measure: -vs
detail: "{value} sink, limit {threshold}"
sustain: 5 s
above: { low: 1200 fpm, medium: 1500 fpm }
---
rule: high-sink-below-500
version: 1
title: High descent rate below 500 ft
domain: stability
description: >
  Descent rate from 500 ft to the flare. EASA Data4Safety, below 500 ft:
  more than 1200 fpm (SL2B) or 1500 fpm (SL3). Held 5 s, the persistence
  of the first threshold (3 s for the second; a rule has one).
why_it_matters: >
  A high descent rate this close to the ground cannot be arrested in the
  flare: a hard or short landing follows.
advice: >
  Below 500 ft an approach needing more than 1000 fpm is unstable: go
  around.
phase: Approach
aircraft: transport
when: height < 500 ft
measure: -vs
detail: "{value} sink, limit {threshold}"
sustain: 5 s
above: { medium: 1200 fpm, high: 1500 fpm }
---
rule: high-sink-light
version: 1
title: High descent rate below 500 ft (light aircraft)
domain: stability
description: >
  Descent rate from 500 ft to the flare, held 5 s. FSF ALAR stabilised
  approach: no more than 1000 fpm; the levels 1200 / 1500 / 2000 fpm are a
  FOQA-Sim estimate.
why_it_matters: >
  A steep, fast final leaves little height to arrest the sink: a common
  precursor of hard and short landings.
advice: >
  Fly a stable path of about 3 degrees (roughly 500-700 fpm in a light
  aircraft); more than 1000 fpm on short final: go around.
phase: Approach
aircraft: light
when: height < 500 ft
measure: -vs
detail: "{value} sink, limit {threshold}"
sustain: 5 s
above: { low: 1200 fpm, medium: 1500 fpm, high: 2000 fpm }
---
rule: high-sink-light-above-500
version: 1
title: High descent rate from 1000 ft to 500 ft (light aircraft)
domain: stability
description: >
  Descent rate from 1000 ft to 500 ft, held 3 s. FSF ALAR stabilised
  approach: no more than 1000 fpm below 1000 ft; the levels 1500 / 2000 fpm,
  above those of the transport rule as a light pattern is flown closer in,
  are a FOQA-Sim estimate.
why_it_matters: >
  A dive through the pattern to make the runway leaves the aircraft fast and
  high on final, the start of an unstable approach and a long or hard
  landing.
advice: >
  Fly the pattern at its height and start the descent abeam the touchdown
  point at about 500 fpm; too high on base, extend or go around rather than
  dive.
phase: Approach
aircraft: light
when: height < 1000 ft and height >= 500 ft
measure: -vs
detail: "{value} sink, limit {threshold}"
sustain: 3 s
above: { low: 1500 fpm, medium: 2000 fpm }
---
rule: bank-above-500
version: 1
title: Excessive bank from 1000 ft to 500 ft
domain: stability
description: >
  Bank angle from 1000 ft to 500 ft, held 3 s. EASA Data4Safety, above
  500 ft: more than 15 deg (SL1) or 30 deg (SL2A).
why_it_matters: >
  Still turning steeply on final means the aircraft is not lined up, and
  bank raises the stall speed close to the ground.
advice: >
  Plan the turn onto final so it is complete with shallow bank well before
  500 ft.
phase: Approach
aircraft: transport
when: height < 1000 ft and height >= 500 ft
measure: abs(roll)
detail: "{value} bank, limit {threshold}"
sustain: 3 s
above: { low: 15 deg, medium: 30 deg }
---
rule: bank-below-500
version: 3
title: Excessive bank below 500 ft
domain: stability
description: >
  Bank angle below 500 ft in the air, after liftoff as on approach, held
  3 s. EASA Data4Safety, below 500 ft: more than 15 deg (SL2B) or 30 deg
  (SL3). Light aircraft: `bank-light`.
why_it_matters: >
  Steep bank close to the ground raises the stall speed (about 7% at 20 deg,
  41% at 45 deg) and risks a wingtip strike; a stall in a low turn is rarely
  recoverable.
advice: >
  Plan the pattern so the turn to final is complete with shallow bank (15
  deg or less) well above 500 ft. Overshooting final: go around, do not
  tighten the turn.
phase: [Takeoff, InitialClimb, Approach, Landing, GoAround]
aircraft: transport
when: height < 500 ft and not air_ground
measure: abs(roll)
detail: "{value} bank, limit {threshold}"
sustain: 3 s
above: { medium: 15 deg, high: 30 deg }
---
rule: bank-light
version: 2
title: Excessive bank below 300 ft (light aircraft)
domain: stability
description: >
  Bank angle below 300 ft in the air, after liftoff as on approach, held
  3 s. FSF ALAR: wings level by 300 ft on a circling approach; the levels
  15 / 20 / 30 deg are a FOQA-Sim estimate.
why_it_matters: >
  Steep bank close to the ground raises the stall speed (about 7% at 20 deg,
  41% at 45 deg) and risks a wingtip strike; a stall in a low turn is rarely
  recoverable.
advice: >
  Plan the pattern so the turn to final is complete with shallow bank (15
  deg or less) above 300 ft. Overshooting final: go around, do not
  tighten the turn.
phase: [Takeoff, InitialClimb, Approach, Landing, GoAround]
aircraft: light
when: height < 300 ft and not air_ground
measure: abs(roll)
detail: "{value} bank, limit {threshold}"
sustain: 3 s
above: { low: 15 deg, medium: 20 deg, high: 30 deg }
---
rule: bank-light-above-300
version: 1
title: Excessive bank from 1000 ft to 300 ft (light aircraft)
domain: stability
description: >
  Bank angle on approach from 1000 ft to 300 ft (below: `bank-light`), held
  3 s. FAA-H-8083-3 (Airplane Flying Handbook): turn base to final with a
  shallow to medium bank (medium up to 45 deg), as a steep bank at
  approach speed raises the stall speed toward it. Low above 30 deg is a
  FOQA-Sim estimate; medium is a steep turn, past 45 deg.
why_it_matters: >
  A steep turn at pattern speed is the classic base-to-final stall-spin:
  the stall speed rises with bank (19% at 45 deg) while the nose is held up
  to tighten the turn.
advice: >
  Plan the base so the turn to final needs 30 deg or less; overshooting
  final, go around rather than steepen the turn.
phase: Approach
aircraft: light
when: height < 1000 ft and height >= 300 ft
measure: abs(roll)
detail: "{value} bank, limit {threshold}"
sustain: 3 s
above: { low: 30 deg, medium: 45 deg }
---
rule: hard-landing
version: 1
title: Hard landing
domain: contact
description: >
  Peak normal load at touchdown, transport aircraft. Levels 1.6 / 1.8 /
  2.1 g; ~2.1 g is the 737 hard-landing indication on an 8 Hz recording
  (EASA EOFDM RE30, ATSB).
why_it_matters: >
  A high load at touchdown can damage the landing gear and airframe and may
  require a maintenance inspection.
advice: >
  Arrive stabilised on speed and path, flare at the right height and reduce
  the descent rate before contact. If the approach is unstable, go around.
at: touchdown
aircraft: transport
measure: td.peak_g
detail: "{value} at touchdown, limit {threshold}"
above: { low: 1.6 g, medium: 1.8 g, high: 2.1 g }
---
rule: hard-landing-light
version: 1
title: Hard landing (light aircraft)
domain: contact
description: >
  Peak normal load at touchdown, light aircraft (normal-category limit
  load 3.8 g). Levels are a FOQA-Sim estimate.
why_it_matters: >
  A firm touchdown stresses the gear, the gear attachments and the propeller
  clearance; repeated hard landings cause structural damage.
advice: >
  Approach at the published speed, start the flare at about 10-20 ft and
  hold the aircraft off while the speed bleeds. Bounced or ballooned: go
  around.
at: touchdown
aircraft: light
measure: td.peak_g
detail: "{value} at touchdown, limit {threshold}"
above: { low: 1.8 g, medium: 2.2 g, high: 2.6 g }
---
rule: high-sink-touchdown
version: 2
title: High sink rate at touchdown
domain: contact
description: >
  Rate of descent at main-gear contact, transport aircraft. 14 CFR 25.473:
  6 ft/s (360 fpm) at the design takeoff weight, 10 ft/s (600 fpm) at the
  design landing weight; 480 fpm is a FOQA-Sim estimate. Light aircraft:
  `high-sink-touchdown-light`.
why_it_matters: >
  A high descent rate at contact puts the gear near its design load (600 fpm
  is the certification limit for transport aircraft).
advice: >
  Reduce the descent rate in the flare; touch down at 100-300 fpm. Keep a
  little power if the sink builds, and go around from an unstable flare.
at: touchdown
aircraft: transport
measure: td.sink
detail: "{value} sink at touchdown, limit {threshold}"
above: { low: 360 fpm, medium: 480 fpm, high: 600 fpm }
---
rule: high-sink-touchdown-light
version: 1
title: High sink rate at touchdown (light aircraft)
domain: contact
description: >
  Rate of descent at main-gear contact, light aircraft. Levels 400 / 500 /
  700 fpm are a FOQA-Sim estimate (CS-23 not checked).
why_it_matters: >
  A firm arrival stresses the gear, its attachments and the propeller
  clearance; repeated hard landings cause structural damage.
advice: >
  Reduce the descent rate in the flare and hold the aircraft off; touch
  down at 100-300 fpm.
at: touchdown
aircraft: light
measure: td.sink
detail: "{value} sink at touchdown, limit {threshold}"
above: { low: 400 fpm, medium: 500 fpm, high: 700 fpm }
---
rule: bounced-landing
version: 1
title: Bounced landing
domain: contact
description: >
  More than one main-gear air-to-ground transition (EASA EOFDM RE30).
why_it_matters: >
  A bounce leaves the aircraft airborne, slow and nose-high near the runway;
  the second touchdown is often harder and can strike the nose gear or the
  tail.
advice: >
  On a light bounce, hold the attitude and let it settle; on a high bounce,
  go around with full power. Prevent it with a stable approach and a proper
  flare.
at: touchdown
measure: td.bounce
level: medium
---
rule: long-landing
version: 1
title: Long landing
domain: point
description: >
  Touchdown beyond the touchdown zone, whose length is min(3000 ft, LDA/3)
  of the landing runway (sources to be confirmed: FAA P/CG 3000 ft,
  one-third rule). Needs the airport data recorded in flight.
why_it_matters: >
  Touching down beyond the touchdown zone eats runway needed to stop: a
  leading cause of runway excursions.
advice: >
  Aim for the touchdown zone markings at the target speed, do not float. If
  you will not be down in the touchdown zone, go around.
at: touchdown
measure: td.long_landing
level: medium
---
rule: short-landing
version: 1
title: Short landing
domain: point
description: >
  Touchdown before the landing threshold. Needs the airport data recorded
  in flight.
why_it_matters: >
  Touching down before the threshold means landing short of the runway, into
  terrain, lights or obstacles.
advice: >
  Keep a stable path to the aiming point, use the glideslope or PAPI, and
  never let the aircraft settle below the path close in.
at: touchdown
measure: td.short_landing
level: high
---
rule: off-centreline-touchdown
version: 1
title: Touchdown off the runway centreline
domain: lateral
description: >
  Distance of the touchdown from the runway centreline. Levels are a
  FOQA-Sim estimate. Needs the airport data recorded in flight.
why_it_matters: >
  Touching down off the centreline reduces the margin to the runway edge and
  increases the risk of a lateral runway excursion.
advice: >
  Correct for crosswind (wing low or crab and kick) and track the extended
  centreline down to touchdown.
at: touchdown
measure: abs(td.cross)
detail: "{value} off the centreline, limit {threshold}"
above: { low: 25 ft, medium: 40 ft, high: 60 ft }
---
rule: stall-warning
version: 3
title: Stall warning
domain: energy
description: >
  Stall warning (stick shaker) active in the air, from liftoff to
  touchdown: a transport never meets it in normal flight, the flare
  included. Light aircraft: `stall-warning-light`.
why_it_matters: >
  The aircraft is close to the stall; at low height a stall or departure
  from controlled flight may not be recoverable.
advice: >
  Lower the nose to reduce the angle of attack, level the wings and add full
  power. Prevent it by keeping speed above the minimum for the
  configuration.
phase: [Takeoff, InitialClimb, EnRoute, Approach, Landing, GoAround]
aircraft: transport
when: not air_ground
measure: stall.warning
sustain: 1 s
level: high
---
rule: stall-warning-light
version: 1
title: Stall warning (light aircraft)
domain: energy
description: >
  Stall warning active in flight, light aircraft. Below 50 ft it counts
  only while climbing, so the landing flare is excluded whatever the phase
  boundaries: the horn often sounds just before touchdown by design. The
  takeoff to 35 ft is excluded too: a soft-field liftoff flies in ground
  effect near the horn on purpose (FAA-H-8083-3 ch. 6).
why_it_matters: >
  The aircraft is close to the stall; at low height a stall or departure
  from controlled flight may not be recoverable.
advice: >
  Lower the nose to reduce the angle of attack, level the wings and add full
  power. Prevent it by keeping speed above the minimum for the
  configuration.
phase: [InitialClimb, EnRoute, Approach, GoAround]
aircraft: light
when: height >= 50 ft or vs > 0 fpm
measure: stall.warning
sustain: 1 s
level: high
---
rule: go-around
version: 1
title: Go-around
domain: other
description: >
  Recorded for context, not as a fault: a go-around is the safe outcome of
  an unstable approach.
why_it_matters: >
  Not a fault: a go-around is the safe response to an unstable approach. It
  is recorded so the approach before it can be reviewed.
advice: >
  Review what made the approach unstable. Going around was the right call.
phase: GoAround
measure: true
level: advisory
---
rule: flap-overspeed
version: 1
title: Flap overspeed
domain: energy
description: >
  IAS above the VFE for the flap angle, which comes from the aircraft's
  type profile (profiles/<ICAO>.yaml, manufacturer's airspeed limitations).
  The flap angle is recorded every 2 s and interpolated between samples;
  the 2 s sustain spans at least one of them, so no event rests on the
  interpolation alone. Silent without a profile. Levels above VFE are a
  FOQA-Sim estimate.
why_it_matters: >
  Exceeding VFE stresses the flap structure and its attachments beyond what
  they were certified for; it can damage the flaps and requires a
  maintenance inspection.
advice: >
  Reduce speed below VFE (the top of the white arc) before extending the
  flaps, and retract them before accelerating beyond it.
phase: [InitialClimb, EnRoute, Approach, Landing, GoAround]
measure: ias - profile.vfe
detail: "{ias} at flaps {flap.te_angle}, limit {profile.vfe}"
sustain: 2 s
above: { low: 0 kt, medium: 5 kt, high: 10 kt }
---
rule: tailstrike-risk-takeoff
version: 1
title: Tailstrike risk at rotation
domain: other
description: >
  Tail clearance margin on the runway during rotation: the tail-contact
  pitch with the main gear struts extended, from the aircraft's type
  profile, minus the pitch. EASA EOFDM: warn when the margin is 2 deg or
  less (thresholds are strict here: under 2 deg); the 1 deg high level is
  a FOQA-Sim estimate. Silent without a published tail-contact angle.
why_it_matters: >
  Too much pitch with the main wheels on the runway can strike the tail,
  damaging the aft pressure bulkhead.
advice: >
  Rotate at VR at the recommended rate (about 2-3 deg per second in a jet)
  to the target pitch; do not rotate early or pull fast.
phase: Takeoff
when: air_ground
measure: profile.tail_takeoff_pitch - pitch
detail: "{pitch} pitch, {value} from tail contact, limit {threshold}"
below: { medium: 2 deg, high: 1 deg }
---
rule: rejected-takeoff
version: 1
title: Rejected takeoff
domain: other
description: >
  A takeoff roll that slowed again without a liftoff (the RejectedTakeoff
  phase, docs/phases.md), graded by its highest IAS. Every reject is low;
  above 80 kt, where Boeing's procedures and the FAA Takeoff Safety
  Training Aid split off the high-speed regime (reject only for a major
  failure), medium; above 100 kt, Airbus's split and the Training Aid's
  high-speed segment, high. Light aircraft: `rejected-takeoff-light`.
why_it_matters: >
  Most rejected-takeoff overruns start at high speed, close to V1: the
  energy left to stop grows with the square of the speed and the runway
  left shrinks.
advice: >
  Brief the reject criteria before every takeoff: below 80 kt (100 kt on
  Airbus) reject for any failure, above it only for an engine failure,
  fire or a sign the aircraft cannot fly; past V1, continue.
phase: RejectedTakeoff
aircraft: transport
measure: ias
detail: "rejected at {value}"
above: { low: 0 kt, medium: 80 kt, high: 100 kt }
---
rule: rejected-takeoff-light
version: 1
title: Rejected takeoff (light aircraft)
domain: other
description: >
  A takeoff roll that slowed again without a liftoff (the RejectedTakeoff
  phase, docs/phases.md), light aircraft, at its highest IAS. Low at any
  speed: a light aircraft has no published reject regimes.
why_it_matters: >
  An abandoned takeoff run uses runway for the acceleration and again for
  the stop; late in the run there may not be enough left.
advice: >
  Before the takeoff pick an abort point on the runway (for example 70 % of
  the rotation speed by its halfway mark) and close the throttle at once if
  the run is not normal by then.
phase: RejectedTakeoff
aircraft: light
measure: ias
detail: "rejected at {value}"
above: { low: 0 kt }
---
rule: rotation-rate
version: 1
title: Rotation rate out of range
domain: other
description: >
  Peak pitch rate of the rotation (from 1 deg above the roll's pitch to
  35 ft, over 0.5 s; the `rotation_rate_dps` flying-skill measure), checked
  at liftoff. Boeing FCTM: rotate at 2-3 deg/s; Airbus: about 3 deg/s
  ("What about rotation technique", 2020). CAP 739 lists a high pitch rate
  at rotation among the core events. The levels, above 4 / 5 deg/s and
  below 1.5 deg/s, are a FOQA-Sim estimate.
why_it_matters: >
  Too fast a rotation can strike the tail before the aircraft flies; too
  slow lengthens the takeoff run beyond the AFM distance, which assumes the
  normal rate.
advice: >
  At VR rotate smoothly and continuously at about 2-3 deg per second to the
  target pitch, then follow the flight director.
phase: Takeoff
aircraft: transport
gate: not air_ground
measure: takeoff.rotation_rate
detail: "{value} rotation, limit {threshold}"
above: { low: 4 deg/s, medium: 5 deg/s }
below: { low: 1.5 deg/s }
---
rule: early-flap-retraction
version: 1
title: Flaps retracted below 400 ft after takeoff
domain: other
description: >
  Flap angle under its liftoff setting below 400 ft after takeoff, held
  2 s (the flap sample period). 14 CFR 25.111(c)(4): the takeoff path
  allows no configuration change but the gear until 400 ft above the
  takeoff surface. More than 1 deg under, to allow for the flap sensor.
why_it_matters: >
  Retracting the flaps before the acceleration height takes lift away while
  the aircraft is slow and close to the ground, eroding the margin above
  the stall the takeoff performance relies on.
advice: >
  Keep the takeoff flaps to the acceleration height (at least 400 ft, 1000
  ft in most SOPs) and retract them on the flap speed schedule.
phase: [Takeoff, InitialClimb]
aircraft: transport
when: not air_ground and height < 400 ft
measure: takeoff.flap - flap.te_angle
detail: "flaps {flap.te_angle} at {height}, {takeoff.flap} at liftoff"
sustain: 2 s
above: { medium: 1 deg }
---
rule: tailstrike-risk-landing
version: 1
title: Tailstrike risk at touchdown
domain: contact
description: >
  Tail clearance margin at main-gear contact: the tail-contact pitch with
  the struts compressed, from the aircraft's type profile, minus the
  touchdown pitch. EASA EOFDM: warn when the margin is 2 deg or less
  (thresholds are strict here: under 2 deg); the 1 deg high level is a
  FOQA-Sim estimate. Silent without a published tail-contact angle.
why_it_matters: >
  A high pitch at touchdown can strike the tail; it usually follows a slow
  approach or an excessive flare.
advice: >
  Hold the approach speed into the flare and do not over-flare; never
  increase pitch to stop a bounce or a float. If in doubt, go around.
at: touchdown
measure: profile.tail_landing_pitch - td.pitch
detail: "{td.pitch} pitch, {value} from tail contact, limit {threshold}"
below: { medium: 2 deg, high: 1 deg }
---
rule: hard-landing-inspection
version: 1
title: Hard-landing inspection required
domain: contact
description: >
  Peak normal load at touchdown above the manufacturer's hard-landing
  maintenance inspection threshold, from the aircraft's type profile
  (aircraft maintenance manual). Silent without a published threshold.
why_it_matters: >
  The touchdown exceeded the manufacturer's hard-landing load: in a real
  aircraft it must be reported and inspected before the next flight.
advice: >
  Report it in the tech log. Prevent it with a stabilised approach and a
  timely flare; go around from an unstable one.
at: touchdown
measure: td.peak_g - profile.hard_landing_g
detail: "{td.peak_g} at touchdown, inspection above {profile.hard_landing_g}"
above: { high: 0 g }
---
rule: vmo-exceedance
version: 1
title: Maximum operating speed exceeded
domain: energy
description: >
  IAS above VMO (VNE for types without one) from the aircraft's type
  profile (AFM limitations or the type certificate data sheet). MACH is not
  recorded, so MMO exceedances above the crossover altitude are not seen.
  Silent without a profile value. Levels above VMO are a FOQA-Sim estimate.
why_it_matters: >
  Above VMO the airframe is outside its certified flutter and structural
  margins; in a real aircraft the overspeed is reported and may need an
  inspection.
advice: >
  Watch the speed trend in descents and turbulence; reduce thrust early,
  use the speedbrakes, and shallow the descent before the barber pole.
phase: [InitialClimb, EnRoute, Approach, GoAround]
when: not air_ground
measure: ias - profile.vmo
detail: "{ias}, limit {profile.vmo}"
sustain: 2 s
above: { low: 0 kt, medium: 5 kt, high: 10 kt }
---
rule: gear-extended-overspeed
version: 1
title: Gear extended overspeed
domain: energy
description: >
  IAS above VLE with the landing gear down, from the aircraft's type
  profile (AFM limitations). Silent without a profile value or with fixed
  gear. Levels above VLE are a FOQA-Sim estimate.
why_it_matters: >
  Flying faster than VLE with the gear down overloads the gear doors and
  their attachments; it requires a maintenance inspection.
advice: >
  Slow below VLE before selecting the gear down, and raise it promptly
  after takeoff before accelerating.
phase: [Takeoff, InitialClimb, EnRoute, Approach, GoAround]
when: not air_ground and gear.extended > 99 %
measure: ias - profile.vle
detail: "{ias} with the gear down, limit {profile.vle}"
sustain: 2 s
above: { low: 0 kt, medium: 5 kt, high: 10 kt }
---
rule: gear-operating-overspeed
version: 2
title: Gear operated above its speed limit
domain: energy
description: >
  IAS above VLO while the landing gear is in transit, from the aircraft's
  type profile (AFM limitations; the lower of the extension and retraction
  limits). The gear position is recorded every 4 s and read as its last
  sample, so a transit counts only where a sample saw it. Silent without a
  profile value. Levels above VLO are a FOQA-Sim estimate.
why_it_matters: >
  The gear doors are open while the gear moves; above VLO the airloads can
  damage the doors and the actuating mechanism.
advice: >
  Check the speed is below VLO before moving the gear lever, in both
  directions.
phase: [Takeoff, InitialClimb, EnRoute, Approach, GoAround]
when: not air_ground and gear.extended > 1 % and gear.extended < 99 %
measure: ias - profile.vlo
detail: "{ias} with the gear moving, limit {profile.vlo}"
sustain: 1 s
above: { low: 0 kt, medium: 5 kt, high: 10 kt }
---
rule: crosswind-above-demonstrated
version: 1
title: Landing crosswind above demonstrated
domain: lateral
description: >
  Crosswind component at touchdown, from the wind at contact and the
  runway heading, above the maximum demonstrated crosswind in the
  aircraft's type profile (AFM). The demonstrated value is not a limit;
  the medium level is a FOQA-Sim estimate. Silent without a matched runway
  or a profile value.
why_it_matters: >
  Beyond the demonstrated crosswind the aircraft's handling was not shown
  during certification: drift at touchdown, side loads on the gear and a
  runway excursion become more likely.
advice: >
  Check the crosswind component against the demonstrated value before the
  approach; consider another runway or airport, and land with the
  recommended crosswind technique (crab, de-crab in the flare).
at: touchdown
measure: td.crosswind - profile.max_crosswind
detail: "{td.crosswind} crosswind, demonstrated {profile.max_crosswind}"
above: { low: 0 kt, medium: 5 kt }
---
rule: tailwind-landing-limit
version: 1
title: Tailwind above the landing limit
domain: rollout
description: >
  Tailwind component at touchdown, from the wind at contact and the runway
  heading, above the aircraft's certified tailwind limit (type profile, AFM
  limitations). The high level is a FOQA-Sim estimate. Silent without a
  matched runway or a profile value.
why_it_matters: >
  A tailwind raises the groundspeed at touchdown and lengthens the landing
  distance; above the certified limit the performance data no longer
  applies and the risk of a runway overrun grows.
advice: >
  Check the wind before the approach and choose the runway into wind; with
  a tailwind above the limit, do not land on that runway.
at: touchdown
measure: td.tailwind - profile.max_tailwind
detail: "{td.tailwind} tailwind, limit {profile.max_tailwind}"
above: { medium: 0 kt, high: 5 kt }
