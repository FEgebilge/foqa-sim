[package]
name = "foqa-sim-app"
description = "FOQA-Sim desktop app: records every MSFS flight from the tray and shows its debrief."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "foqa-sim"
path = "src/main.rs"

[features]
default = ["connect"]
# The site client (docs/challenge-protocol.md B1): off, the app has no
# network code for challenges and works from challenge files only.
connect = ["dep:connect", "dep:open", "dep:tauri-plugin-deep-link", "tauri-plugin-single-instance/deep-link"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
capture = { path = "../../crates/capture" }
challenge = { path = "../../crates/challenge" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
connect = { path = "../../crates/connect", optional = true }
debrief = { path = "../../crates/debrief" }
open = { version = "5", optional = true }
recorder = { path = "../../crates/recorder" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
