[workspace]
members = ["crates/*", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.11.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FEgebilge/foqa-sim"
publish = false

# panic stays unwind: the app's recorder thread runs under catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
