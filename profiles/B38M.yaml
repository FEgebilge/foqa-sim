# Boeing 737 MAX 8 type profile (the MSFS 2024 default 737). Schema: docs/rules.md.
#
# Flaps, vmo, vle, vlo, crosswind and hard_landing_g are 737 NG values
# assumed identical on the MAX (approximate, see each note); no MAX-specific
# source was found.
type: B38M
name: Boeing 737 MAX 8
class: transport
tail_contact:
  takeoff: { value: 11.0 deg, source: &fctm "Boeing 737 FCTM, takeoff tail clearance table, 737-8 row, e.g. Copa 737 FCTM section 3.35, https://cmpva.org/descargas/B737_FCTM.pdf", note: "struts extended, wheels on runway" }
  landing: { value: 9.2 deg, source: "Boeing 737 FCTM, landing body/tail-skid contact chart, 737-8 with one-position tail skid, +-0.1 deg, Copa 737 FCTM p. 6.14, https://cmpva.org/descargas/B737_FCTM.pdf#page=276", note: "struts compressed; MSFS skid configuration unverified" }
hard_landing_g: { value: 2.2 g, source: "737 NG AMM 2.2 g hard-landing indication (see B738); an encyclopedia page also cites 2.2 g / 600 fpm", approximate: true, note: "737 NG value applied to the MAX" }
vmo: { value: 340 kt, source: "EASA TCDS IM.A.120 Issue 29 Sec 8 says 'See Airplane Flight Manual'; value from 737 NG/MAX FCOM limitations (340 KCAS/0.82M)", approximate: true, note: "TCDS defers to the AFM; 340 KCAS is the widely published 737 NG/MAX value, not read from a primary document" }
vle: { value: 320 kt, source: &ng "b737.org.uk/limitations.htm + Boeing 737 NG flashcards (NG placards; MAX not directly verified)", approximate: true, note: "737 NG gear extended 320 kt/0.82M; assumed same on the MAX" }
vlo: { value: 235 kt, source: *ng, approximate: true, note: "737 NG retract 235 kt, extend 270 kt; lower value given, assumed same on the MAX" }
max_crosswind: { value: 33 kt, source: "Boeing 737 FCTM max demonstrated crosswind (dry runway, 10 m wind), from memory", approximate: true, note: "demonstrated value, not a limitation; not re-verified online" }
max_tailwind: { value: 15 kt, source: "EASA TCDS IM.A.120 Issue 29, https://www.easa.europa.eu/en/downloads/7297/en", note: "TCDS 'Max takeoff and landing tailwind 15 knots'; EASA operational approval only up to 10 kt without further approval" }
flaps:
  - { up_to: 5 deg, vfe: { value: 250 kt, source: *ng, approximate: true, note: "737 NG flaps 1, 2, 5; assumed same on the MAX" } }
  - { up_to: 10 deg, vfe: { value: 210 kt, source: *ng, approximate: true, note: "737 NG flaps 10; assumed same on the MAX" } }
  - { up_to: 15 deg, vfe: { value: 200 kt, source: *ng, approximate: true, note: "737 NG flaps 15; assumed same on the MAX" } }
  - { up_to: 25 deg, vfe: { value: 190 kt, source: *ng, approximate: true, note: "737 NG flaps 25; assumed same on the MAX" } }
  - { up_to: 30 deg, vfe: { value: 175 kt, source: *ng, approximate: true, note: "737 NG flaps 30; assumed same on the MAX" } }
  - { vfe: { value: 162 kt, source: *ng, approximate: true, note: "737 NG flaps 40; assumed same on the MAX" } }
