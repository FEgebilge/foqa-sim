# Cessna Citation Longitude (Model 700) type profile. Schema: docs/rules.md.
type: C700
name: Cessna Citation Longitude (700)
class: transport
flaps:
  - up_to: 7 deg
    vfe: { value: 250 kt, source: &fpg "Citation Longitude Flight Planning Guide, Specifications p. 2-4, https://aviav.ru/wp-content/uploads/2020/04/citation-longitude-fpg.pdf", note: "Flaps 1" }
  - up_to: 15 deg
    vfe: { value: 230 kt, source: *fpg, note: "Flaps 2" }
  - vfe: { value: 180 kt, source: *fpg, note: "Flaps FULL" }
