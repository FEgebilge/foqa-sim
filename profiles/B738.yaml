# Boeing 737-800 type profile (e.g. third-party add-ons). Schema: docs/rules.md.
#
# Flaps, vle, vlo are 737 NG placard values from secondary sources that
# describe the NG directly (not approximate). vmo and crosswind stay approximate.
type: B738
name: Boeing 737-800
class: transport
tail_contact:
  takeoff: { value: 11.0 deg, source: "Boeing 737 NG FCTM Rev 21, section 3.37-3.38 tail strike pitch table, https://p7aviation.com/LMS/wp-content/uploads/2023/03/B737-NG-FCTM_Rev_21.pdf" }
  landing: { value: 9.2 deg, source: "Boeing 737 NG FCTM Rev 21, section 6.13-6.15 landing contact chart, https://p7aviation.com/LMS/wp-content/uploads/2023/03/B737-NG-FCTM_Rev_21.pdf", note: "standard / one-position skid; about 8.8 deg with the two-position skid" }
hard_landing_g:
  value: 2.2 g
  source: 'ATSB AO-2023-010 quoting the Boeing 737 AMM: "an indication of a hard landing on the main landing gear is a peak recorded vertical acceleration that exceeds 2.2 G", https://www.atsb.gov.au/sites/default/files/2023-12/AO-2023-010%20Final.pdf#page=9'
  note: "for main-gear-first touchdowns with roll <= 2 deg; assumes a 16 samples/s DFDR (Flight Safety Digest Aug 2004, flightsafety.org/fsd/fsd_aug04.pdf), which is the rate td.peak_g is read at"
vmo: { value: 340 kt, source: "EASA TCDS IM.A.120 Issue 29 Sec 8 (NG sections equivalent) says 'See Airplane Flight Manual'; FAA TCDS A16WE also defers to the AFM; value from 737 NG FCOM limitations (340 KCAS/0.82M)", approximate: true, note: "TCDS defers to the AFM; 340 KCAS is the widely published 737 NG value, not read from a primary document" }
vle: { value: 320 kt, source: &ng "b737.org.uk/limitations.htm + Boeing 737 NG flashcards (NG placards)", note: "gear extended 320 kt/0.82M; secondary source describing the NG directly" }
vlo: { value: 235 kt, source: *ng, note: "retract 235 kt, extend 270 kt; lower value given" }
max_crosswind: { value: 33 kt, source: "Boeing 737 FCTM max demonstrated crosswind (dry runway, 10 m wind), from memory", approximate: true, note: "demonstrated value, not a limitation; not re-verified online" }
max_tailwind: { value: 15 kt, source: "EASA TCDS IM.A.120 Issue 29 (shared with FAA TCDS A16WE), https://www.easa.europa.eu/en/downloads/7297/en", note: "TCDS 'Max takeoff and landing tailwind 15 knots'; EASA operational approval only up to 10 kt without further approval" }
vref:
  source: "Boeing, Aerodrome Reference Code and Approach Speeds, Rev A, table row 737-800: approach speed 142 kt, MLW 66,361 kg, https://www.boeing.com/content/dam/boeing/v2/airports/faq/arcandapproachspeeds.pdf"
  approximate: true
  note: "published value is the ICAO threshold speed at maximum landing weight and the maximum certificated landing flap; lighter weights scaled by sqrt(W/MLW) (Vref is 1.3 Vs and Vs goes with sqrt(W) at constant CL max); other landing flaps read a few kt higher, not published"
  flaps:
    - { flap: 40 deg, weights_kg: [43100, 49800, 56400, 66361], ias: [114 kt, 123 kt, 131 kt, 142 kt] }
flaps:
  - { up_to: 5 deg, vfe: { value: 250 kt, source: *ng, note: "flaps 1, 2, 5" } }
  - { up_to: 10 deg, vfe: { value: 210 kt, source: *ng, note: "flaps 10" } }
  - { up_to: 15 deg, vfe: { value: 200 kt, source: *ng, note: "flaps 15" } }
  - { up_to: 25 deg, vfe: { value: 190 kt, source: *ng, note: "flaps 25" } }
  - { up_to: 30 deg, vfe: { value: 175 kt, source: *ng, note: "flaps 30" } }
  - { vfe: { value: 162 kt, source: *ng, note: "flaps 40" } }
