# Airbus A310-300 (iniBuilds) type profile. Schema: docs/rules.md.
#
# No tail_contact, hard_landing_g, max_crosswind, max_tailwind: no reachable
# source (A300-600 reports cite about 11 deg, not the A310). Not invented.
type: A310
name: Airbus A310-300 (iniBuilds)
class: transport
vmo: { value: 360 kt, source: "EASA TCDS EASA.A.172 Issue 08 (1 Feb 2026) sec. 13.5, https://easa.europa.eu/downloads/17110/en", note: "MMO 0.84. 340 kt for several weight variants (01,03,05,08,09,12,13) and with less than 2 t in an outer tank; 360 for the basic model. Real-aircraft value, the iniBuilds sim may differ" }
vle: { value: 270 kt, source: &snip "studylib A310 MSFS manual (search snippet; page blocked by bot check): VLE 270 kt/M0.65", approximate: true, note: "from a search snippet only; the sister A300-600 FAA AFM 2.03.01 https://www.faa.gov/sites/faa.gov/files/A300-600AFM.pdf also gives VLE 270/0.65" }
vlo: { value: 270 kt, source: "same snippet: VLO 270 kt/M0.59", approximate: true, note: "from a search snippet only; the A300-600 AFM has VLO ext 270, ret 240 kt, A310 retract value not found, so this may be high for retraction" }
flaps:
  - { up_to: 15 deg, vfe: { value: 210 kt, source: &fl "studylib A310 snippet lists 245/210/195/180 kt (labels garbled); mapped by analogy to the A300-600 FAA AFM (slats15/f0 250, 15/15 215, 15/20 205, 30/40 175)", approximate: true, note: "slats 15/flaps 15; slats-only 245 skipped; mapping by analogy" } }
  - { up_to: 20 deg, vfe: { value: 195 kt, source: *fl, approximate: true, note: "slats 15/flaps 20; mapping by analogy" } }
  - { vfe: { value: 180 kt, source: *fl, approximate: true, note: "slats 30/flaps 40, landing; mapping by analogy" } }
