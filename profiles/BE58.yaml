vref:
  source: "Beechcraft G58 Baron POH and FAA Approved AFM P/N 58-590000-67A8 (pdfcoffee copy of the G58 POH), https://pdfcoffee.com/g58-poh-pdf-free.html, Section 4 Airspeeds for Safe Operation: Landing Approach (5400 lbs), flaps down (30 deg) 95 kts"
  approximate: true
  note: "published approach speed at the 5400 lb maximum landing weight; lighter weights scaled by sqrt(W/MLW) (Vref is 1.3 Vs and Vs goes with sqrt(W) at constant CL max)"
