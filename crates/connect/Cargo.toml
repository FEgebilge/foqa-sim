[package]
name = "connect"
description = "Optional FOQA Challenge Protocol client: site discovery, sign-in, tokens and the attempt upload queue. Nothing in the core depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
recorder = { path = "../recorder" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2.5"

[dev-dependencies]
challenge = { path = "../challenge" }
tempfile = "3"
